# Shared settings for every RL method. Method files override only what differs.
env: {}                      # GateScenarioEnv overrides (reward weights, horizon, ...)

sac:
  learning_rate: 3.0e-4
  buffer_size: 300000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 1          # updates per env step (UTD); model-based methods raise this
  ent_coef: auto

agent:
  lagrangian: false
  cost_budget: 1.0           # (collisions + out-of-road) per km
  lambda_init: 0.0
  lambda_lr: 0.01
  cost_window: 20
  warmup_updates: 5000       # actor frozen while critics learn on BC-policy data
  bc_reg: 1.0                # beta in beta * ||pi(s) - pi_BC(s)||^2, annealed to 0
  bc_reg_anneal_updates: 50000
  use_model: false

train:
  total_steps: 100000
  failure_frac: 0.7          # share of episodes drawn from the BC failure set
  bc_init: true
  seed_buffer_with_demos: true
  checkpoint_every: 10000
  log_interval: 10
